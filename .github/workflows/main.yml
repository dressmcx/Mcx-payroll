name: Employee Late Check in

  schedule:
    # This runs every day at 9:00 AM UTC. 
    # You can adjust the cron expression to fit your business hours.
    - cron: '3 0 1 1 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  check-late-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install resend supabase

      - name: Run Late Check Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node check-late.js
